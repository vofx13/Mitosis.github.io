<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How the Cell Cycle Works</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:#05080f;overflow:hidden;
    font-family:'Myriad Pro','Gill Sans','Trebuchet MS',sans-serif;}
  #viewport{position:fixed;inset:0;display:grid;place-items:center;}
  #screen{
    position:relative;width:720px;height:722px;transform-origin:center center;
    background:
      repeating-linear-gradient(90deg,
        rgba(255,255,255,.045) 0px, rgba(255,255,255,.045) 1px,
        rgba(255,255,255,0) 1px, rgba(255,255,255,0) 8px),
      linear-gradient(160deg,#224286 0%,#2c4d8f 45%,#3c5fa0 100%);
    box-shadow:0 0 70px rgba(0,0,0,.85),0 0 0 1px rgba(0,0,0,.65);
    overflow:hidden;
  }
  /* TITLE BAR */
  #titlebar{position:absolute;left:0;top:0;width:720px;height:78px;
    background:linear-gradient(180deg,#1c2d7a 0%,#142268 55%,#0f1a4e 100%);
    border-bottom:2px solid rgba(0,0,0,.55);
    box-shadow:0 2px 10px rgba(0,0,0,.55);}
  #logo{position:absolute;left:27px;top:16px;width:48px;height:53px;
    background:#d8202a;border:2px solid #fff;border-radius:3px;
    color:#fff;font-size:8.5px;font-weight:bold;line-height:1.05;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;letter-spacing:.2px;
    box-shadow:0 2px 5px rgba(0,0,0,.55);}
  #titletext{position:absolute;left:88px;top:21px;
    font-size:34px;font-weight:bold;color:#e3cd8a;letter-spacing:.3px;
    text-shadow:0 2px 3px rgba(0,0,0,.8),0 0 12px rgba(0,0,0,.5);
    font-family:'Trebuchet MS','Myriad Pro',sans-serif;white-space:nowrap;}
  /* STAGE */
  #stagewrap{position:absolute;left:29px;top:80px;width:672px;height:487px;
    border:3px solid #1a1d2b;border-radius:14px;box-sizing:content-box;
    overflow:hidden;background:#373f57;
    box-shadow:inset 0 0 40px rgba(0,0,0,.55),0 3px 10px rgba(0,0,0,.5);}
  #stage{position:absolute;left:0;top:0;width:672px;height:487px;display:block;}
  #noise{position:absolute;inset:0;opacity:.25;pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.6'/></svg>");
    background-repeat:repeat;}
  /* CONTROLS */
  #controls{position:absolute;left:19px;top:573px;width:694px;height:36px;border-radius:18px;
    background:linear-gradient(180deg,#8a2230 0%,#761a24 32%,#4a1116 74%,#3b0e10 100%);
    border:1px solid rgba(255,180,160,.20);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.20),
               inset 0 -3px 8px rgba(0,0,0,.65),0 3px 9px rgba(0,0,0,.6);}
  .cbtn{position:absolute;top:2px;height:32px;width:42px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;border-radius:16px;user-select:none;
    transition:background .15s;}
  .cbtn:hover{background:rgba(255,255,255,.09);}
  .cbtn .lb{font-size:7.5px;color:#fff;margin-top:1px;letter-spacing:.4px;
    text-shadow:0 1px 1px rgba(0,0,0,.9);font-weight:bold;}
  .vsep{position:absolute;top:8px;width:1px;height:20px;
    background:linear-gradient(180deg,transparent,rgba(0,0,0,.6),transparent);}
  #track{position:absolute;left:138px;top:16px;width:430px;height:6px;border-radius:3px;
    background:#2a0a0d;
    box-shadow:inset 0 2px 3px rgba(0,0,0,.85),0 1px 0 rgba(255,255,255,.08);
    cursor:pointer;}
  #fill{position:absolute;left:0;top:0;height:100%;width:0;border-radius:3px;
    background:linear-gradient(180deg,#f3e2a2,#c9a63c);opacity:.5;}
  #knob{position:absolute;top:-6px;left:0;width:18px;height:18px;border-radius:50%;
    background:radial-gradient(circle at 34% 28%,#ffeaa0,#f0d878 58%,#c9a63c 100%);
    border:1.5px solid #6b4b18;box-shadow:0 1px 4px rgba(0,0,0,.7);
    transform:translateX(-9px);pointer-events:none;}
  /* CAPTION */
  #caption{position:absolute;left:29px;top:616px;width:672px;height:77px;
    background:#d2c8bb;border-radius:8px;padding:11px 14px;color:#1a1a1a;
    font-size:16px;line-height:1.18;letter-spacing:.1px;overflow:hidden;
    font-family:'Gill Sans','Myriad Pro','Trebuchet MS',sans-serif;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 2px 7px rgba(0,0,0,.45);
    transition:opacity .25s;}
  #caption.hidden{opacity:0;}
  /* FOOTER */
  #footer{position:absolute;left:29px;top:698px;width:672px;height:18px;
    display:flex;justify-content:space-between;align-items:center;
    color:#fff;font-size:10px;}
  #footer .l{font-weight:bold;letter-spacing:.6px;font-size:9.5px;opacity:.92;}
  #footer .r{font-size:11px;opacity:.92;}
</style>
</head>
<body>
<div id="viewport">
  <div id="screen">
    <div id="titlebar">
      <div id="logo"><span>Mc</span><span>Graw</span><span>Hill</span></div>
      <div id="titletext">How the Cell Cycle Works</div>
    </div>
    <div id="stagewrap">
      <svg id="stage" viewBox="0 0 672 487" preserveAspectRatio="xMidYMid meet">
        <defs>
          <radialGradient id="gCell" gradientUnits="objectBoundingBox"
                          cx="0.36" cy="0.30" r="0.85">
            <stop offset="0"    stop-color="#8ba5cc"/>
            <stop offset="0.5"  stop-color="#7a99c4"/>
            <stop offset="1"    stop-color="#4f6f9f"/>
          </radialGradient>
          <radialGradient id="gNucleus" gradientUnits="objectBoundingBox"
                          cx="0.34" cy="0.30" r="0.85">
            <stop offset="0"   stop-color="#c971b4"/>
            <stop offset="0.5" stop-color="#b45ba0"/>
            <stop offset="1"   stop-color="#9c3d8a"/>
          </radialGradient>
          <radialGradient id="gMini" gradientUnits="objectBoundingBox"
                          cx="0.36" cy="0.30" r="0.85">
            <stop offset="0"   stop-color="#8ba5cc"/>
            <stop offset="0.5" stop-color="#7a99c4"/>
            <stop offset="1"   stop-color="#4f6f9f"/>
          </radialGradient>
          <radialGradient id="gGlow" gradientUnits="objectBoundingBox"
                          cx="0.5" cy="0.5" r="0.5">
            <stop offset="0"    stop-color="#e0523a" stop-opacity="0.7"/>
            <stop offset="0.55" stop-color="#e0523a" stop-opacity="0.28"/>
            <stop offset="1"    stop-color="#e0523a" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="gCent" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0"   stop-color="#bcd8f4"/>
            <stop offset="0.5" stop-color="#9fc2ea"/>
            <stop offset="1"   stop-color="#6f9fd4"/>
          </linearGradient>
          <linearGradient id="gChromG" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0"   stop-color="#5fb872"/>
            <stop offset="0.5" stop-color="#3a8a4a"/>
            <stop offset="1"   stop-color="#2a6a36"/>
          </linearGradient>
          <linearGradient id="gChromP" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0"   stop-color="#9374c8"/>
            <stop offset="0.5" stop-color="#6a4a9a"/>
            <stop offset="1"   stop-color="#4a3080"/>
          </linearGradient>
          <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="10"/>
          </filter>
          <filter id="soft4" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="4"/>
          </filter>
          <filter id="dropShadow" x="-60%" y="-60%" width="220%" height="220%">
            <feDropShadow dx="2" dy="4" stdDeviation="3"
                          flood-color="#000" flood-opacity="0.35"/>
          </filter>
          <clipPath id="nucleusClip" clipPathUnits="userSpaceOnUse">
            <circle cx="0" cy="0" r="95"/>
          </clipPath>
        </defs>

        <!-- ============ PIE SCENE ============ -->
        <g id="pieScene">
          <g id="pieWedges"></g>
          <g id="pieSubLines"></g>
          <g id="pieRing">
            <ellipse id="ringBase" fill="none" stroke="#cfd0ee"
                     stroke-width="10" opacity="0.95"/>
            <ellipse id="ringActive" fill="none" stroke="#e8974a"
                     stroke-width="10" pathLength="1"
                     stroke-dasharray="1" stroke-dashoffset="1"/>
            <path id="ringGrowth" fill="none" stroke="#e8974a"
                  stroke-width="10" stroke-linecap="round"/>
            <path id="ringMito" fill="none" stroke="#e8974a"
                  stroke-width="10" stroke-linecap="round"/>
            <path id="ringCyto" fill="none" stroke="#e8974a"
                  stroke-width="10" stroke-linecap="round"/>
          </g>
          <g id="pieText"></g>
          <g id="pieArrow"></g>
          <g id="pieBubbles"></g>
          <g id="pieMini"></g>
        </g>

        <!-- ============ DARK OVERLAY ============ -->
        <rect id="darkOverlay" x="0" y="0" width="672" height="487"
              fill="#000" opacity="0"/>

        <!-- ============ CELL SCENE ============ -->
        <g id="cellScene">
          <g id="cellRoot" transform="translate(336 243)"></g>
        </g>

        <!-- ============ DAUGHTER SCENE ============ -->
        <g id="daughterScene" transform="translate(336 243)">
          <g id="daughterRoot" opacity="0"></g>
        </g>

        <g id="daughterLabel" opacity="0"></g>
        <g id="menuLayer"></g>
      </svg>
      <div id="noise"></div>
    </div>

    <!-- CONTROLS -->
    <div id="controls">
      <div class="cbtn" id="btnPlay" style="left:6px;">
        <svg width="17" height="15" viewBox="0 0 17 15">
          <polygon id="playPoly" points="2.5,1 15,7.5 2.5,14"
                   fill="#4cd964" stroke="#4cd964" stroke-width="2.4"
                   stroke-linejoin="round"/>
        </svg>
        <div class="lb">Play</div>
      </div>
      <div class="vsep" style="left:50px;"></div>
      <div class="cbtn" id="btnPause" style="left:54px;">
        <svg width="14" height="14" viewBox="0 0 14 14">
          <rect x="1" y="1" width="4" height="12" rx="1" fill="#ffffff"/>
          <rect x="9" y="1" width="4" height="12" rx="1" fill="#ffffff"/>
        </svg>
        <div class="lb">Pause</div>
      </div>
      <div class="vsep" style="left:100px;"></div>
      <div id="track">
        <div id="fill"></div>
        <div id="knob"></div>
      </div>
      <div class="cbtn" id="btnAudio" style="left:578px;">
        <svg width="16" height="14" viewBox="0 0 16 14">
          <path d="M1 5 L4.5 5 L8 1.5 L8 12.5 L4.5 9 L1 9 Z" fill="#4cd964"/>
          <path id="audioWave1" d="M10.5 4.2 Q12 7 10.5 9.8" fill="none"
                stroke="#4cd964" stroke-width="1.6" stroke-linecap="round"/>
          <path id="audioWave2" d="M12.6 2.4 Q15 7 12.6 11.6" fill="none"
                stroke="#4cd964" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <div class="lb">Audio</div>
      </div>
      <div class="vsep" style="left:634px;"></div>
      <div class="cbtn" id="btnText" style="left:640px;">
        <svg width="15" height="14" viewBox="0 0 15 14">
          <rect x="1" y="1" width="13" height="12" rx="2" fill="none"
                stroke="#4cd964" stroke-width="1.6"/>
          <line x1="4" y1="5" x2="11" y2="5" stroke="#4cd964"
                stroke-width="1.6" stroke-linecap="round"/>
          <line x1="4" y1="8" x2="11" y2="8" stroke="#4cd964"
                stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <div class="lb">Text</div>
      </div>
    </div>

    <div id="caption"></div>

    <div id="footer">
      <div class="l">RECORDED WITH ◉ SCREENCAST ◉ MATIC</div>
      <div class="r">Copyright © The McGraw-Hill Companies, Inc.</div>
    </div>
  </div>
</div>

<script>
"use strict";
/* =====================================================================
   HOW THE CELL CYCLE WORKS
   Single-file SVG animation, pure render(t), canvas 720x722
   ===================================================================== */

const SVGNS = 'http://www.w3.org/2000/svg';
const FONT  = "'Myriad Pro','Gill Sans','Trebuchet MS',sans-serif";
const DUR   = 184;

/* ---------- PIE geometry (stage-local coords) ---------- */
/*  screen (411,348) − stage offset (29,80) = (382,268) */
const PIE = { cx:382, cy:268, rx:205, ry:182,
              ringRx:213, ringRy:190 };

/* ---------- COLOUR TABLE (from spec) ---------- */
const C = {
  pieGrowth:'#80829b', pieMito:'#686c89', pieCyto:'#52557e',
  ring:'#cfd0ee', ringHot:'#e8974a',
  labelMain:'#ffffff', labelSub:'#a8abc8',
  interphaseTxt:'#3a3f66',
  menuTitle:'#d6d8f0', menuIdle:'#7f86a8', menuActive:'#f0a040',
  chromG:'#3a8a4a', chromGe:'#1e5a30',
  chromP:'#6a4a9a', chromPe:'#3f2870',
  chromatin:'#4a5a58',
  spindle:'#d9603f'
};

/* ---------- TIMELINE ---------- */
const T = {
  scanEnd: 6,
  g1Start: 30, g1End: 42,
  sStart: 42, sEnd: 48,
  g2Start: 48, g2End: 54,
  mitoPieS: 54, mitoPieE: 66,
  proStart: 66, proEnd: 90,
  metaStart: 90, metaEnd: 102,
  anaStart: 102, anaEnd: 120,
  teloStart: 120, teloEnd: 132,
  cytoStart: 138, cytoEnd: 150,
  daughterStart: 150, daughterEnd: 162,
  overviewStart: 160,
  miniMitoStart: 168,
  miniCellsStart: 174,
  end: 184
};

/* ---------- CAPTIONS (verbatim from spec) ---------- */
const CAPTIONS = [
  {t:0,   s:"Most eukaryotic cells follow a process of growth and division called the cell cycle. These events include a growth stage, mitosis or nuclear division and cytokinesis or division of the cytoplasm."},
  {t:12,  s:"Throughout interphase, the cell is engaged in growth and metabolic activities. Interphase can be further broken down into 3 discrete phases called G1, S and G2."},
  {t:30,  s:"During the G1 or first growth phase, normal cell functions occur as well as cell growth."},
  {t:42,  s:"In the S phase, DNA replicates producing 2 copies of each chromosome."},
  {t:48,  s:"During the G2 phase, the cell continues to prepare for mitosis and cell division."},
  {t:54,  s:"Mitosis or the M phase has four stages, prophase, metaphase, anaphase and telophase."},
  {t:66,  s:"During Prophase the chromosomes become visible and condense, becoming shorter and thicker."},
  {t:72,  s:"Each identical copy of a single chromosome is called a sister chromatid. The nuclear envelope breaks down and spindle fibers form as microtubules grow out of the centrioles that move to opposite poles of the cell."},
  {t:90,  s:"During metaphase, the double-stranded chromosomes line up along the equator of the cell. The spindle is now fully formed and the microtubules attach to each sister chromatid."},
  {t:102, s:"Anaphase begins when the sister chromatids of each chromosome begin to separate."},
  {t:108, s:"The centromere that holds sister chromatids together divides and the chromosomes move away from each other along its spindle fiber."},
  {t:120, s:"In telophase, the two groups of chromosomes reach the opposite ends of the cell. As a new nuclear envelope starts to form around each group, the chromosomes uncoil and the spindle disappears."},
  {t:138, s:"The division of the cytoplasm and organelles is called cytokinesis or the C phase. The result of mitosis and cytokinesis is the formation of two genetically identical cells."},
  {t:160, s:"To summarize the entire cycle, G1, S and G2 phases occur during interphase while the cell is growing and preparing to divide."},
  {t:168, s:"Mitosis, or the division of the nucleus consists of 4 phases, prophase, metaphase, anaphase and telophase and in these phases duplicate copies of the chromosomes are split equally."},
  {t:178, s:"Finally, the cell's cytoplasm divides during cytokinesis and results in the formation of 2 genetically identical daughter cells."}
];
function captionAt(t){
  let s = CAPTIONS[0].s;
  for(const c of CAPTIONS) if(t>=c.t) s = c.s;
  return s;
}

/* ---------- helpers ---------- */
const clamp = (v,a,b)=>v<a?a:(v>b?b:v);
const lerp  = (a,b,u)=>a+(b-a)*u;
const smooth= u=>u*u*(3-2*u);
function kf(t,keys){
  if(t<=keys[0][0]) return keys[0][1];
  for(let i=1;i<keys.length;i++){
    if(t<=keys[i][0]){
      const t0=keys[i-1][0],v0=keys[i-1][1];
      const t1=keys[i][0],  v1=keys[i][1];
      if(t1===t0) return v1;
      return lerp(v0,v1,smooth((t-t0)/(t1-t0)));
    }
  }
  return keys[keys.length-1][1];
}
function svgEl(tag,attrs,parent){
  const e=document.createElementNS(SVGNS,tag);
  if(attrs)for(const k in attrs) e.setAttribute(k,attrs[k]);
  if(parent) parent.appendChild(e);
  return e;
}
function buildNucleusImage(parent){
  const g=svgEl('g',{},parent);
  svgEl('image',{x:-118,y:-101.5,width:236,height:203,href:'nhan.png',
    preserveAspectRatio:'none','clip-path':'url(#nucleusClip)'},g);
  return g;
}
function buildCentrioleImage(parent,scale){
  const g=svgEl('g',{},parent);
  const s=scale||1;
  svgEl('circle',{cx:0,cy:0,r:32*s,fill:'url(#gGlow)'},g);
  svgEl('image',{x:-29*s,y:-27*s,width:58*s,height:54*s,
    href:'trungthe.png',preserveAspectRatio:'xMidYMid meet'},g);
  return g;
}
function setOp(el,v){
  if(!el) return;
  const vv=clamp(v,0,1);
  if(vv<0.002){
    if(el.style.display!=='none') el.style.display='none';
  }else{
    if(el.style.display==='none') el.style.display='';
    el.setAttribute('opacity',vv.toFixed(3));
  }
}
function setTxt(el,s){ if(el.__t!==s){el.__t=s; el.textContent=s;} }
function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function polar(cx,cy,rx,ry,deg){
  const a=deg*Math.PI/180;
  return [cx+rx*Math.cos(a), cy+ry*Math.sin(a)];
}
function wedgePath(cx,cy,rx,ry,a0,a1){
  const [x0,y0]=polar(cx,cy,rx,ry,a0);
  const [x1,y1]=polar(cx,cy,rx,ry,a1);
  const large=(a1-a0)>180?1:0;
  return `M${cx.toFixed(2)},${cy.toFixed(2)} L${x0.toFixed(2)},${y0.toFixed(2)} `+
         `A${rx},${ry} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z`;
}
function arcPath(cx,cy,rx,ry,a0,a1){
  const [x0,y0]=polar(cx,cy,rx,ry,a0);
  const [x1,y1]=polar(cx,cy,rx,ry,a1);
  const large=(a1-a0)>180?1:0;
  return `M${x0.toFixed(2)},${y0.toFixed(2)} `+
         `A${rx},${ry} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)}`;
}
function smoothPath(pts){
  if(pts.length<2) return '';
  const n=pts.length;
  let d=`M${pts[0][0].toFixed(3)},${pts[0][1].toFixed(3)}`;
  for(let i=0;i<n-1;i++){
    const p0=pts[i>0?i-1:0], p1=pts[i], p2=pts[i+1], p3=pts[i+2<n?i+2:n-1];
    const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
    const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    d+=`C${c1x.toFixed(3)},${c1y.toFixed(3)} `+
       `${c2x.toFixed(3)},${c2y.toFixed(3)} `+
       `${p2[0].toFixed(3)},${p2[1].toFixed(3)}`;
  }
  return d;
}

/* =====================================================================
   PIE — build wedges, sub-lines, ring, labels, arrow, bubbles
   ===================================================================== */
const els = {};
['pieScene','pieWedges','pieSubLines','pieRing','pieText','pieArrow',
 'pieBubbles','pieMini','ringBase','ringActive','ringGrowth','ringMito',
 'ringCyto','darkOverlay','menuLayer','cellScene','cellRoot',
 'daughterScene','daughterRoot','daughterLabel','caption','knob','fill',
 'playPoly','audioWave1','audioWave2','track','screen'
].forEach(id=>els[id]=document.getElementById(id));

/* --- Wedges --- */
svgEl('path',{d:wedgePath(PIE.cx,PIE.cy,PIE.rx,PIE.ry,214,473),
              fill:C.pieGrowth},els.pieWedges);
svgEl('path',{d:wedgePath(PIE.cx,PIE.cy,PIE.rx,PIE.ry,113,183),
              fill:C.pieMito},els.pieWedges);
svgEl('path',{d:wedgePath(PIE.cx,PIE.cy,PIE.rx,PIE.ry,183,214),
              fill:C.pieCyto},els.pieWedges);

/* --- Dotted sub-dividers --- */
function dotted(deg,parent,op){
  const [x,y]=polar(PIE.cx,PIE.cy,PIE.rx,PIE.ry,deg);
  return svgEl('path',{
    d:`M${PIE.cx},${PIE.cy} L${x.toFixed(2)},${y.toFixed(2)}`,
    stroke:'#ffffff','stroke-width':1.1,
    'stroke-dasharray':'4 4',opacity:op,fill:'none'
  },parent);
}
const gInterLines=svgEl('g',{opacity:0},els.pieSubLines);
dotted(0, gInterLines,.65);
dotted(65,gInterLines,.65);
const gMitoLines=svgEl('g',{opacity:0},els.pieSubLines);
dotted(130,gMitoLines,.65);
dotted(148,gMitoLines,.65);
dotted(165,gMitoLines,.65);

/* --- Ring --- */
els.ringBase.setAttribute('cx',PIE.cx);
els.ringBase.setAttribute('cy',PIE.cy);
els.ringBase.setAttribute('rx',PIE.ringRx);
els.ringBase.setAttribute('ry',PIE.ringRy);
els.ringActive.setAttribute('cx',PIE.cx);
els.ringActive.setAttribute('cy',PIE.cy);

/* --- Arrow on ring at 214° (tangent, up-right) --- */
const arrowG=svgEl('g',{},els.pieArrow);
(function buildArrow(){
  const {cx,cy,ringRx,ringRy}=PIE;
  const a0=202, a1=211;
  svgEl('path',{d:arcPath(cx,cy,ringRx,ringRy,a0,a1),fill:'none',
    stroke:'#d7d8f2','stroke-width':8,'stroke-linecap':'round'},arrowG);
  /* head base at a1 */
  const th=a1*Math.PI/180;
  const bx=cx+ringRx*Math.cos(th), by=cy+ringRy*Math.sin(th);
  /* tangent direction: d/dθ (rx cosθ, ry sinθ) = (−rx sinθ, ry cosθ) */
  const tx=-ringRx*Math.sin(th), ty=ringRy*Math.cos(th);
  const ta=Math.atan2(ty,tx);
  const hl=32,hw=26;
  const tipX=bx+Math.cos(ta)*hl, tipY=by+Math.sin(ta)*hl;
  const px=Math.cos(ta+Math.PI/2), py=Math.sin(ta+Math.PI/2);
  svgEl('polygon',{
    points:`${tipX.toFixed(2)},${tipY.toFixed(2)} `+
           `${(bx+px*hw/2).toFixed(2)},${(by+py*hw/2).toFixed(2)} `+
           `${(bx-px*hw/2).toFixed(2)},${(by-py*hw/2).toFixed(2)}`,
    fill:'#d7d8f2',stroke:'#1a1d2b','stroke-width':1,
    'stroke-linejoin':'round'
  },arrowG);
})();

/* =====================================================================
   COIL (chromatin) — deterministic continuous line
   ===================================================================== */
const COIL_CACHE={};
function coilD(seed){
  if(COIL_CACHE[seed]) return COIL_CACHE[seed];
  const rnd=mulberry32(seed);
  const loops=6+Math.floor(rnd()*3);
  const steps=340;
  const pts=[];
  for(let i=0;i<=steps;i++){
    const u=i/steps;
    const a=u*Math.PI*2*loops;
    const rr=0.46+0.10*Math.sin(a*0.5+seed);
    const wob=0.05*Math.sin(u*14+seed*2);
    pts.push([(rr+wob)*Math.cos(a), (rr+wob)*Math.sin(a)*0.92]);
  }
  const d=smoothPath(pts);
  COIL_CACHE[seed]=d;
  return d;
}
/* =====================================================================
   MINI CELLS (overview bubbles)
   ===================================================================== */
function buildMini(parent,r,stage,seed){
  const g=svgEl('g',{},parent);
  const rnd=mulberry32(seed);

  /* body */
  if(stage===3){ /* telophase pinched */
    const N=96;let d='';
    for(let i=0;i<=N;i++){
      const a=i/N*Math.PI*2-Math.PI/2;
      const s=Math.abs(Math.sin(a));
      const rr=r*(1-0.55*Math.pow(s,5));
      d+=(i?'L':'M')+(Math.cos(a)*rr).toFixed(2)+','+(Math.sin(a)*rr).toFixed(2);
    }
    d+='Z';
    svgEl('path',{d,fill:'url(#gMini)',stroke:'#b9cdea','stroke-width':1.4},g);
  }else{
    svgEl('circle',{cx:0,cy:0,r,fill:'url(#gMini)',
      stroke:'#b9cdea','stroke-width':1.4},g);
  }
  svgEl('ellipse',{cx:-r*0.34,cy:-r*0.38,rx:r*0.34,ry:r*0.20,
    fill:'#ffffff',opacity:.16,
    transform:`rotate(-30 ${-r*0.34} ${-r*0.38})`},g);

  function miniCent(cx,cy,sc){
    const cg=svgEl('g',{transform:`translate(${cx} ${cy})`},g);
    svgEl('circle',{cx:0,cy:0,r:13*sc,fill:'url(#gGlow)'},cg);
      svgEl('image',{x:-24*sc,y:-22*sc,width:48*sc,height:44*sc,
        href:'trungthe.png',preserveAspectRatio:'xMidYMid meet'},cg);
  }
  function miniChrom(d,col,str,w){
    svgEl('path',{d,fill:'none',stroke:str,'stroke-width':w*1.3,
      'stroke-linecap':'round','stroke-linejoin':'round'},g);
    svgEl('path',{d,fill:'none',stroke:col,'stroke-width':w,
      'stroke-linecap':'round','stroke-linejoin':'round'},g);
    svgEl('path',{d,fill:'none',stroke:'#ffffff',opacity:.30,
      'stroke-width':w*0.30,'stroke-linecap':'round',
      transform:'translate(-0.5 -0.5)'},g);
  }

  if(stage===0){ /* PROPHASE */
    svgEl('circle',{cx:0,cy:0,r:r*0.66,fill:'url(#gNucleus)',
      stroke:'#6d2a6e','stroke-width':1.3},g);
    const pos=[[-0.36,-0.40],[0.36,-0.40],[-0.36,0.40],[0.36,0.40]];
    pos.forEach((p,i)=>{
      const px=p[0]*r, py=p[1]*r;
      const col=i%2===0?C.chromG:C.chromP;
      const str=i%2===0?C.chromGe:C.chromPe;
      const apexY=py-r*0.18;
      [-1,1].forEach(sgn=>{
        const d=`M${px},${apexY} Q${px+sgn*r*0.05},${py} `+
                `${px+sgn*r*0.10},${py+r*0.16}`;
        miniChrom(d,col,str,r*0.058);
      });
      svgEl('circle',{cx:px,cy:apexY,r:r*0.026,fill:str},g);
    });
  }
  else if(stage===1){ /* METAPHASE */
    [-1,1].forEach(sgn=>miniCent(sgn*r*0.80,0,r/95));
    [-0.55,-0.18,0.18,0.55].forEach(fy=>{
      const y=fy*r;
      [-1,1].forEach(sgn=>{
        const px=sgn*r*0.80;
        svgEl('path',{d:`M${px},0 Q${px*0.45},${y*0.45} 0,${y}`,
          fill:'none',stroke:C.spindle,'stroke-width':0.7,opacity:.8},g);
      });
    });
    [-0.58,-0.20,0.20,0.58].forEach((fy,i)=>{
      const y=fy*r;
      const col=i%2===0?C.chromG:C.chromP;
      const str=i%2===0?C.chromGe:C.chromPe;
      const hh=r*0.16,hw=r*0.08;
      miniChrom(`M${-hw},${y-hh} Q0,${y} ${hw},${y+hh}`,col,str,r*0.048);
      miniChrom(`M${hw},${y-hh} Q0,${y} ${-hw},${y+hh}`,col,str,r*0.048);
      svgEl('circle',{cx:0,cy:y,r:r*0.026,fill:str},g);
    });
  }
  else if(stage===2){ /* ANAPHASE */
    [-1,1].forEach(sgn=>miniCent(sgn*r*0.80,0,r/95));
    [-0.42,-0.14,0.14,0.42].forEach(fy=>{
      const y=fy*r;
      [-1,1].forEach(sgn=>{
        const px=sgn*r*0.80;
        svgEl('path',{d:`M${px},0 Q${px*0.5},${y*0.5} ${sgn*r*0.28},${y}`,
          fill:'none',stroke:C.spindle,'stroke-width':0.65,opacity:.7},g);
      });
    });
    [-0.48,-0.16,0.16,0.48].forEach((fy,i)=>{
      const y=fy*r;
      const col=i%2===0?C.chromG:C.chromP;
      const str=i%2===0?C.chromGe:C.chromPe;
      const cxL=-r*0.42, cxR=r*0.42;
      miniChrom(`M${cxL+r*0.12},${y-r*0.10} Q${cxL},${y} `+
                `${cxL-r*0.12},${y+r*0.10}`,col,str,r*0.048);
      miniChrom(`M${cxR-r*0.12},${y-r*0.10} Q${cxR},${y} `+
                `${cxR+r*0.12},${y+r*0.10}`,col,str,r*0.048);
    });
  }
  else if(stage===3){ /* TELOPHASE */
    [-1,1].forEach(sgn=>{
      const cx=sgn*r*0.42;
      svgEl('circle',{cx,cy:0,r:r*0.30,fill:'url(#gNucleus)',
        stroke:'#6d2a6e','stroke-width':1.1},g);
      const cg=svgEl('g',{transform:`translate(${cx} 0) `+
        `scale(${(r*0.30).toFixed(2)})`},g);
      svgEl('path',{d:coilD(seed+(sgn>0?7:13)),fill:'none',
        stroke:C.chromatin,'stroke-width':0.055,
        'stroke-linecap':'round','stroke-linejoin':'round'},cg);
    });
    miniCent(-r*0.78,r*0.55,r/95);
    miniCent( r*0.78,r*0.55,r/95);
  }
  else if(stage===5){ /* INTERPHASE BUBBLE */
    svgEl('circle',{cx:0,cy:0,r:r*0.46,fill:'url(#gNucleus)',
      stroke:'#6d2a6e','stroke-width':1.2},g);
    const cg=svgEl('g',{transform:`scale(${(r*0.42).toFixed(2)})`},g);
    svgEl('path',{d:coilD(seed),fill:'none',stroke:C.chromatin,
      'stroke-width':0.06,'stroke-linecap':'round','stroke-linejoin':'round'},cg);
    miniCent(0,r*0.72,r/100);
  }
  return g;
}

/* =====================================================================
   CELL PATH
   ===================================================================== */
function cellPathD(R,furrow){
  const N=120;
  let d='';
  for(let i=0;i<=N;i++){
    const a=i/N*Math.PI*2-Math.PI/2;
    const s=Math.abs(Math.sin(a));
    const r=R*(1-furrow*Math.pow(s,5));
    d+=(i?'L':'M')+(Math.cos(a)*r).toFixed(2)+','+(Math.sin(a)*r).toFixed(2);
  }
  return d+'Z';
}

let curMenuKey=null;
function getMenu(t){
  if(t>=T.g1Start && t<T.mitoPieS) return {key:'inter',title:'INTERPHASE',items:[
    {l:'G1 phase', on:t>=T.g1Start && t<T.sStart},
    {l:'S phase',  on:t>=T.sStart  && t<T.g2Start},
    {l:'G2 phase', on:t>=T.g2Start && t<T.mitoPieS}
  ]};
  if(t>=T.proStart && t<T.teloEnd+2) return {key:'mito',title:'MITOSIS',items:[
    {l:'Prophase',  on:t>=T.proStart  && t<T.metaStart},
    {l:'Metaphase', on:t>=T.metaStart && t<T.anaStart},
    {l:'Anaphase',  on:t>=T.anaStart  && t<T.teloStart},
    {l:'Telophase', on:t>=T.teloStart && t<T.teloEnd}
  ]};
  if(t>=T.cytoStart-2 && t<T.daughterEnd) return {key:'cyto',title:'CYTOKINESIS',items:[]};
  if(t>=T.overviewStart-3) return {key:'over',title:'OVERVIEW',items:[]};
  return null;
}

  const m=getMenu(t);
  const key=m?m.key+'|'+m.items.map(i=>i.on?1:0).join(''):'none';
  if(key===curMenuKey) return;
  curMenuKey=key;
  while(els.menuLayer.firstChild) els.menuLayer.removeChild(els.menuLayer.firstChild);

/* =====================================================================
   CHROMOSOME GEOMETRY
   ---------------------------------------------------------------------
   Each chromosome = 2 chromatids + centromere dot (per chromatid).
   Prophase : 2×2 grid, short thick, arms slightly splayed
   Metaphase: X at equator (cross at centromere)
   Anaphase : chromatids split, move to ±pole
   ===================================================================== */
const EQUATOR_Y=[-78,-28,28,78];
const PRO_POS  =[[-34,-44],[34,-44],[-34,44],[34,44]];
const PRO_ANGLE=[-12,14,16,-14];
function chromatidPts(i, side, t, R){
  const sgn = side===0 ? -1 : 1;
  const yEq = EQUATOR_Y[i];
  const [px,py]=PRO_POS[i];
  const angle=PRO_ANGLE[i]*Math.PI/180;

  /* --- prophase : separated X-shaped chromosomes --- */
  const arm=side===0?1:-1;
  const pro=[
    [-arm*13,-29],[-arm*7,-14],[0,0],[arm*7,14],[arm*13,29]
  ].map(([x,y])=>[
    px+x*Math.cos(angle)-y*Math.sin(angle),
    py+x*Math.sin(angle)+y*Math.cos(angle)
  ]);
  /* --- metaphase : X crossing at yEq --- */
  const meta = side===0 ? [
    [-8, yEq-36],[-4,yEq-16],[0,yEq],[4,yEq+16],[8,yEq+36]
  ] : [
    [ 8, yEq-36],[ 4,yEq-16],[0,yEq],[-4,yEq+16],[-8,yEq+36]
  ];
  /* --- anaphase : V leading with centromere --- */
  const poleX=(side===0?-1:1)*R*0.72;
  const poleY=yEq*0.42;
  const q=side===0?1:-1;
  const ana=[
    [poleX+q*16, poleY-22],
    [poleX+q*6,  poleY-11],
    [poleX,      poleY],
    [poleX+q*6,  poleY+11],
    [poleX+q*16, poleY+22]
  ];

  const uMeta=smooth(clamp((t-T.metaStart)/2,0,1));
  const uAna =smooth(clamp((t-T.anaStart)/(T.anaEnd-T.anaStart),0,1));

  let A,B;
  if(t<T.proEnd){
    return pro;
  }
  if(t<T.metaEnd){
    return pro.map((p,k)=>[
      lerp(p[0],meta[k][0],uMeta),lerp(p[1],meta[k][1],uMeta)
    ]);
  }
  if(t<T.anaStart) return meta;
  return meta.map((p,k)=>[lerp(p[0],ana[k][0],uAna), lerp(p[1],ana[k][1],uAna)]);
}
function ptsToD(p){
  return `M${p[0][0].toFixed(2)},${p[0][1].toFixed(2)} `+
         `Q${p[1][0].toFixed(2)},${p[1][1].toFixed(2)} `+
         `${p[2][0].toFixed(2)},${p[2][1].toFixed(2)} `+
         `Q${p[3][0].toFixed(2)},${p[3][1].toFixed(2)} `+
         `${p[4][0].toFixed(2)},${p[4][1].toFixed(2)}`;
}

/* =====================================================================
   SUB-RENDERERS
   ===================================================================== */
function renderPie(t){
  const pieOp=kf(t,[[0,1],[25,1],[27,0],[53,0],[55,1],[64,1],[66,0],
                    [158,0],[161,1],[184,1]]);
  setOp(els.pieScene,pieOp);
  if(pieOp<0.003) return;

  /* ring scan 0-6s : complete loop */
  const scanP=clamp(t/T.scanEnd,0,1);
  els.ringActive.setAttribute('stroke-dashoffset',String(1-scanP));
  setOp(els.ringActive,kf(t,[[0,1],[11.4,1],[12.6,0]]));

  setOp(els.ringGrowth,kf(t,[[11.5,0],[13,1],[29,1],[30,0],
                              [158,0],[161,1],[184,1]]));
  setOp(els.ringMito,  kf(t,[[53,0],[55.5,1],[65,1],[67.5,0],
                              [167,0],[169,1],[184,1]]));
  setOp(els.ringCyto,  kf(t,[[177,0],[179,1],[184,1]]));

  /* label hot-times derived from scan: t=(θ-214)/60 s */
  const growthHot = t>=0    || t>=161;
  const mitoHot   = (t>=4.317 && t<12.4) || (t>=54 && t<66) || t>=169;
  const cytoHot   = (t>=5.483 && t<12.4) || t>=179;

  lblGrowth.setAttribute('fill',growthHot?C.ringHot:'#ffffff');
  lblMito.setAttribute('fill',  mitoHot  ?C.ringHot:'#ffffff');
  lblCyto.setAttribute('fill',  cytoHot  ?C.ringHot:'#ffffff');

  setOp(lblInter,   kf(t,[[12.4,0],[14,1],[29,1],[30,0],
                          [159,0],[161,1],[184,1]]));
  setOp(gInterLines,kf(t,[[13,0],[15,1],[27,1],[29,0],[159,0],[161,1],[184,1]]));
  setOp(gMitoLines, kf(t,[[54,0],[56,1],[66,0],[167,0],[169,1],[184,1]]));
  setOp(gMitoLabels,kf(t,[[54,0],[56,1],[66,0],[167,0],[169,1],[184,1]]));
  const gSub=kf(t,[[13,0],[15,1],[27,1],[29,0],[159,0],[161,1],[184,1]]);
  setOp(lblG1,gSub); setOp(lblS,gSub); setOp(lblG2,gSub);

  /* arrow colour */
  const hot=t>=179;
  els.pieArrow.querySelector('path').setAttribute('stroke',hot?C.ringHot:'#d7d8f2');
  els.pieArrow.querySelector('polygon').setAttribute('fill',hot?C.ringHot:'#d7d8f2');

  /* bubbles */
  setOp(bubbleOver,kf(t,[[T.miniMitoStart-1,0],[T.miniMitoStart+1,1],[184,1]]));

  /* overview 4 mini cells */
  miniCells.forEach(m=>{
    const a=m.d.at;
    const o=kf(t,[[a,0],[a+0.9,1],[184,1]]);
    const u=clamp((t-a)/0.9,0,1);
    const sc=u<0.001?0.4:lerp(0.4,1,u*u*(3-2*u));
    setOp(m.g,o);
    if(o>0.002) m.g.setAttribute('transform',
      `translate(${m.d.x} ${m.d.y}) scale(${sc.toFixed(3)})`);
  });
}

function renderOverlay(t){
  const ov=kf(t,[[0,0],[23.5,0],[27,0.65],[29.5,0.05],[30,0],
                 [155.5,0],[158,0.55],[159.6,0.55],[161,0],[184,0]]);
  els.darkOverlay.setAttribute('opacity',ov.toFixed(3));
  els.darkOverlay.style.display=ov<0.002?'none':'';
}

function renderCell(t){
  const cellOp=kf(t,[[0,0],[29,0],[31,1],[53,1],[55,0],[67,0],[69,1],
                     [147,1],[150,0],[184,0]]);
  setOp(els.cellScene,cellOp);
  if(cellOp<0.003) return;

  /* radius schedule : G1 195 → S 202 → G2 215 → M 220 */
  const R=kf(t,[
    [T.g1Start,195],[T.g1End,195],
    [T.sStart, 198],[T.sEnd, 202],
    [T.g2Start,208],[T.g2End, 215],
    [T.proStart,220],[T.teloEnd,220],[T.end,220]
  ]);

  const furrow=kf(t,[[T.cytoStart-2,0],[T.cytoEnd,0.90],[T.end,0.90]]);
  cellShape.setAttribute('d',cellPathD(R,furrow));

  cellHi.setAttribute('cx',(-R*0.30).toFixed(1));
  cellHi.setAttribute('cy',(-R*0.34).toFixed(1));
  cellHi.setAttribute('rx',(R*0.42).toFixed(1));
  cellHi.setAttribute('ry',(R*0.28).toFixed(1));

  /* nucleus */
  const nucR=R*0.44;
  const nucOp=kf(t,[[T.g1Start,0],[T.g1Start+2,1],
                     [T.metaStart-4,1],[T.metaStart+4,0],[184,0]]);
  nucleusImage.setAttribute('transform',
    `scale(${(nucR/95).toFixed(3)})`);
  setOp(nucleusImage,nucOp);

  /* chromosomes */
  const chOp=kf(t,[[T.proStart-1,0],[T.proStart+2,1],
                    [T.teloStart+4,1],[T.teloEnd,0],[184,0]]);
  setOp(chromG,chOp);
  if(chOp>0.003){
    for(let i=0;i<4;i++){
      const o=chromObjs[i];
      [0,1].forEach(side=>{
        const L=o[side===0?'L':'R'];
        const pts=chromatidPts(i,side,t,R);
        const d=ptsToD(pts);
        L.out.setAttribute('d',d);
        L.fill.setAttribute('d',d);
        L.hi.setAttribute('d',d);
        /* dot at centromere */
        L.dot.setAttribute('cx',pts[2][0].toFixed(2));
        L.dot.setAttribute('cy',pts[2][1].toFixed(2));
      });
    }
  }

  /* centrioles */
  const twoC=kf(t,[[T.g2Start-2,0],[T.g2Start+1,1],[184,1]]);
  const sepT=smooth(clamp((t-(T.proStart+6))/16,0,1));
  const poleX=R*0.72;
  const startY=R*0.55;
  const baseX=lerp(0,-22,twoC);

  const c1x=lerp(baseX,-poleX,sepT);
  const c1y=lerp(startY,0,sepT);
  const c2x=lerp(22,poleX,sepT);
  const c2y=lerp(startY,0,sepT);
  const teloShift=smooth(clamp((t-T.teloStart)/(T.teloEnd-T.teloStart),0,1));
  const centrioleX=R*0.68;
  const centrioleY=R*0.16;
  const cent1x=lerp(c1x,-centrioleX,teloShift);
  const cent1y=lerp(c1y,centrioleY,teloShift);
  const cent2x=lerp(c2x,centrioleX,teloShift);
  const cent2y=lerp(c2y,-centrioleY,teloShift);
  const angle1=lerp(90,180,sepT);
  const angle2=lerp(90,0,sepT);

  cent1.setAttribute('transform',
    `translate(${cent1x.toFixed(1)} ${cent1y.toFixed(1)}) rotate(${angle1.toFixed(1)})`);
  cent2.setAttribute('transform',
    `translate(${cent2x.toFixed(1)} ${cent2y.toFixed(1)}) rotate(${angle2.toFixed(1)})`);
  setOp(cent2,twoC);
  setOp(centG,kf(t,[[T.g1Start,0],[T.g1Start+1,1],
                     [T.cytoEnd-2,1],[T.daughterStart,0],[184,0]]));

  /* spindle fibres */
  const spinGrow=smooth(clamp((t-(T.proStart+6))/14,0,1));
  const attachGrow=smooth(clamp((t-T.metaStart)/8,0,1));
  const spinOp  =kf(t,[[T.proStart+2,0],[T.proStart+8,1],
                        [T.teloStart,1],[T.teloEnd,0],[184,0]]);
  setOp(spindleG,spinOp);

  if(spinOp>0.003){
    const poleL={x:c1x,y:c1y}, poleR={x:c2x,y:c2y};
    let k=0;
    for(let ps=0;ps<2;ps++){
      const pole=ps===0?poleL:poleR;
      for(let i=0;i<4;i++){
        const pts=chromatidPts(i,ps,t,R);
        const kx=pts[2][0], ky=pts[2][1];
        const mx=(pole.x+kx)/2, my=(pole.y+ky)/2;
        const dx=kx-pole.x, dy=ky-pole.y;
        const len=Math.hypot(dx,dy)||1;
        const nx=-dy/len, ny=dx/len;
        const bow=14*(ps===0?-1:1);
        const path=spindlePaths[k++];
        path.setAttribute('d',
          `M${pole.x.toFixed(1)},${pole.y.toFixed(1)} `+
          `Q${(mx+nx*bow).toFixed(1)},${(my+ny*bow).toFixed(1)} `+
          `${kx.toFixed(1)},${ky.toFixed(1)}`);
        path.setAttribute('stroke-dashoffset',(1-attachGrow).toFixed(3));
        path.setAttribute('opacity',attachGrow.toFixed(3));
      }
    }
    /* astral */
    let a2=0;
    [poleL,poleR].forEach((pole,ps)=>{
      for(let i=0;i<7;i++){
        const ang=(ps===0?Math.PI:0)+(i-3)*0.42;
        const L=58+(i%3)*14;
        const ex=pole.x+Math.cos(ang)*L;
        const ey=pole.y+Math.sin(ang)*L;
        const path=astraPaths[a2++];
        path.setAttribute('d',
          `M${pole.x.toFixed(1)},${pole.y.toFixed(1)} `+
          `Q${(pole.x+Math.cos(ang)*L*0.55).toFixed(1)},`+
          `${(pole.y+Math.sin(ang)*L*0.55).toFixed(1)} `+
          `${ex.toFixed(1)},${ey.toFixed(1)}`);
        path.setAttribute('opacity',(0.85*spinGrow).toFixed(3));
      }
    });
  }

  /* new nuclei (telophase) */
  const nnOp=kf(t,[[T.teloStart+4,0],[T.teloStart+12,1],
                    [T.teloEnd+4,1],[T.cytoStart,0.4],[T.cytoEnd,0],[184,0]]);
  const nnR =kf(t,[[T.teloStart+4,22],[T.teloStart+14,R*0.31],
                    [T.cytoEnd,R*0.31]]);
  const nnX =R*0.55;
  nucleusL.setAttribute('transform',
    `translate(${(-nnX).toFixed(1)} 0) scale(${(nnR/95).toFixed(3)})`);
  nucleusR.setAttribute('transform',
    `translate(${( nnX).toFixed(1)} 0) scale(${(nnR/95).toFixed(3)})`);
  setOp(nucleusL,nnOp); setOp(nucleusR,nnOp);

  /* contractile ring */
  const actinOp=kf(t,[[T.cytoStart-2,0],[T.cytoStart+2,1],
                        [T.cytoEnd-2,1],[T.cytoEnd,0]]);
  setOp(actinRing,actinOp);
  if(actinOp>0.003){
    actinRing.setAttribute('rx',(R*0.85*(1-furrow)).toFixed(1));
  }

  /* centromere callout 107-120s */
  const coOp=kf(t,[[107,0],[109,1],[118,1],[120.5,0],[184,0]]);
  setOp(callout,coOp);
  if(coOp>0.003){
    /* point to top green chromosome's centromere */
    const pts=chromatidPts(0,0,t,R);
    calloutLine.setAttribute('x2',pts[2][0].toFixed(1));
    calloutLine.setAttribute('y2',pts[2][1].toFixed(1));
  }
}

function renderDaughter(t){
  const dOp=kf(t,[[T.daughterStart-1,0],[T.daughterStart+1,1],
                   [T.daughterEnd,1],[T.daughterEnd+1,0],[184,0]]);
  setOp(els.daughterScene,dOp);
  const dlOp=kf(t,[[T.daughterStart+6,0],[T.daughterStart+8,1],
                    [T.overviewStart-1,1],[T.overviewStart+1,0],[184,0]]);
  setOp(els.daughterLabel,dlOp);
}

function renderCaption(t){
  const cap=captionAt(t);
  if(els.caption.__t!==cap){
    els.caption.__t=cap;
    els.caption.textContent=cap;
  }
}

function renderProgress(t){
  const prog=t/DUR;
  els.knob.style.left=(430*prog)+'px';
  els.fill.style.width=(430*prog)+'px';
  const ended=t>=DUR-0.001;
  els.playPoly.setAttribute('fill',ended?'none':'#4cd964');
}

function render(t){
  t=clamp(t,0,DUR);
  renderPie(t);
  renderOverlay(t);
  renderCell(t);
  renderDaughter(t);
  renderMenu(t);
  renderCaption(t);
  renderProgress(t);
}

/* =====================================================================
   PLAYBACK
   ===================================================================== */
let t=0, playing=false, lastTS=0, needRender=true;
let audioOn=false, lastCaption='';

function fit(){
  const s=Math.min(window.innerWidth/720,window.innerHeight/722);
  els.screen.style.transform=`scale(${s})`;
}
window.addEventListener('resize',fit); fit();

function loop(ts){
  if(!lastTS) lastTS=ts;
  const dt=Math.min((ts-lastTS)/1000,0.1);
  lastTS=ts;
  if(playing){
    t+=dt;
    if(t>=DUR){t=DUR;playing=false;}
    render(t);
  }else if(needRender){
    needRender=false;
    render(t);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function play(){
  if(t>=DUR)t=0;
  playing=true; needRender=true;
  if(audioOn && lastCaption) speak(lastCaption);
}
function pause(){
  playing=false; needRender=true;
  if('speechSynthesis' in window) speechSynthesis.cancel();
}
document.getElementById('btnPlay').addEventListener('click',play);
document.getElementById('btnPause').addEventListener('click',pause);

document.getElementById('btnText').addEventListener('click',()=>{
  els.caption.classList.toggle('hidden');
});

document.getElementById('btnAudio').addEventListener('click',()=>{
  audioOn=!audioOn;
  els.audioWave1.setAttribute('opacity',audioOn?1:0.25);
  els.audioWave2.setAttribute('opacity',audioOn?1:0.25);
  if(audioOn){ if(lastCaption)speak(lastCaption); }
  else{ if('speechSynthesis' in window)speechSynthesis.cancel(); }
});
els.audioWave1.setAttribute('opacity',0.25);
els.audioWave2.setAttribute('opacity',0.25);

/* progress scrubbing */
let dragging=false, scrubTimer=null;
function seek(e){
  const rect=els.track.getBoundingClientRect();
  const u=clamp((e.clientX-rect.left)/rect.width,0,1);
  t=u*DUR;
  if(t>=DUR)playing=false;
  render(t); needRender=true;
  clearTimeout(scrubTimer);
  scrubTimer=setTimeout(()=>{
    if(audioOn){ const c=captionAt(t); if(c)speak(c); }
  },350);
}
els.track.addEventListener('pointerdown',e=>{
  dragging=true;
  try{els.track.setPointerCapture(e.pointerId);}catch(_){}
  seek(e);
});
els.track.addEventListener('pointermove',e=>{ if(dragging)seek(e); });
els.track.addEventListener('pointerup',e=>{
  dragging=false;
  try{els.track.releasePointerCapture(e.pointerId);}catch(_){}
});
els.track.addEventListener('pointercancel',()=>{dragging=false;});

window.addEventListener('keydown',e=>{
  if(e.code==='Space'){ e.preventDefault(); playing?pause():play(); }
  if(e.code==='ArrowRight'){ t=clamp(t+2,0,DUR); render(t); needRender=true; }
  if(e.code==='ArrowLeft'){  t=clamp(t-2,0,DUR); render(t); needRender=true; }
});

function speak(text){
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=0.95; u.pitch=1;
    speechSynthesis.speak(u);
    lastCaption=text;
  }catch(_){}
}

/* capture caption changes for speech */
const origRender=render;
let lastCaptionText='';
render=function(tt){
  origRender(tt);
  const cap=captionAt(clamp(tt,0,DUR));
  if(cap!==lastCaptionText){
    lastCaptionText=cap;
    if(audioOn && playing) speak(cap);
  }
};

/* initial paint */
render(0);
needRender=false;
</script>
